<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weltpolice Belege</title>
<meta name="theme-color" content="#007ac2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Belege">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1b1f24;--muted:#6b7480;--line:#e2e6eb;--accent:#007ac2;--accent-ink:#fff;--ok:#2e9e5b;--warn:#c77700;--danger:#c62828;--chip:#eef3f8}
@media (prefers-color-scheme: dark){:root{--bg:#0f1216;--card:#1a1f26;--ink:#e9edf2;--muted:#9aa4b0;--line:#2a313a;--accent:#3aa3e6;--accent-ink:#04121c;--chip:#232a33}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 16px 8px;display:flex;align-items:center;gap:8px}
header h1{font-size:22px;margin:0;flex:1}
main{padding:0 16px calc(96px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:8px 0 10px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:24px;height:24px}
nav button.active{color:var(--accent)}
.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.entry{display:flex;gap:12px;align-items:center}
.entry img,.thumbph{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--chip);flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.entry .t{flex:1;min-width:0}
.entry .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.small{font-size:13px;color:var(--muted)}
.amount{font-weight:600;white-space:nowrap;text-align:right}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--muted)}
.badge.offen{background:#fff3e0;color:var(--warn)}.badge.eingereicht{background:#e3f2fd;color:#1565c0}.badge.erstattet{background:#e8f5e9;color:var(--ok)}
@media (prefers-color-scheme: dark){.badge.offen{background:#3a2a10}.badge.eingereicht{background:#10283d;color:#7cc0f5}.badge.erstattet{background:#123020}}
h2{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:22px 4px 6px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:80px}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);margin-top:12px;text-align:center}
.btn.secondary{background:var(--chip);color:var(--ink)}
.btn.danger{background:none;color:var(--danger)}
.btn:disabled{opacity:.5}
.iconbtn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:99px;width:44px;height:44px;font-size:26px;line-height:44px;padding:0}
.photos{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.photo{background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;align-items:stretch}
.photo img,.photo .pdf{width:96px;min-height:110px;object-fit:cover;display:flex;align-items:center;justify-content:center;flex:none;font-weight:700;color:var(--muted);background:var(--chip)}
.photo .in{padding:10px;flex:1;min-width:0}
.photo .in .row select{flex:0 0 84px}
.photo .in input,.photo .in select{padding:10px 8px;font-size:16px}
.photo .rm{border:0;background:none;color:var(--danger);font-size:14px;padding:8px 0 0}
.addrow{display:flex;gap:8px;margin-top:10px}.addrow label.btn{margin:0;color:var(--accent-ink)}
.addrow label.btn.secondary{color:var(--ink)}
.addrow input[type=file]{display:none}
.suggest{margin-top:6px}
.chk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk input{width:22px;height:22px;flex:none}
.total{display:flex;justify-content:space-between;font-weight:700;padding-top:10px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.sig{background:#fff;border:1px dashed var(--line);border-radius:10px;width:100%;height:150px;touch-action:none}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:.95}
.filter{display:flex;gap:6px;overflow-x:auto;padding:2px 0}
.filter button{border:0;border-radius:99px;padding:6px 12px;background:var(--chip);color:var(--ink);font:inherit;font-size:14px;white-space:nowrap}
.filter button.on{background:var(--accent);color:var(--accent-ink)}
.hint{background:var(--chip);border-radius:12px;padding:12px;font-size:14px;margin:10px 0}
a{color:var(--accent)}
details.hint summary{cursor:pointer;list-style:none}
details.hint summary::-webkit-details-marker{display:none}
details.hint p{margin:8px 0}
.seg{margin-top:6px;flex-wrap:wrap}
</style>
</head>
<body>
<header><h1 id="title">Belege</h1><span id="headAction"></span></header>
<main id="view"></main>
<nav>
  <button data-tab="belege" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>Belege</button>
  <button data-tab="abrechnen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 15l2 2 4-4"/></svg>Abrechnen</button>
  <button data-tab="archiv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h18v4H3zM5 8v12h14V8M10 12h4"/></svg>Archiv</button>
  <button data-tab="einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Einstellungen</button>
</nav>
<div class="toast" id="toast"></div>
<script src="vendor/pdf-lib.min.js"></script>
<script src="pdf.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="docx.js"></script>
<script src="app.js"></script>
</body>
</html>
